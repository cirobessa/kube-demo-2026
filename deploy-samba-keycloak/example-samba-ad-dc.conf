# Exemplo de configuracao Samba 4 AD DC (sem DNS interno; usa Route 53)
[global]
workgroup = EMPRESA
realm = EMPRESA.LOCAL
netbios name = DC1
server role = active directory domain controller
dns backend = NONE
interfaces = 10.0.1.10/24  # IP do EC2 samba-ad-1 (AZ1)
bind interfaces only = yes
security = ads
encrypt passwords = yes
log file = /var/log/samba/log.samba
# Registro Route 53: dc1.empresa.local -> 10.0.1.10
# Keycloak endpoint: sso.empresa.local -> 10.0.1.50 (AZ1)
