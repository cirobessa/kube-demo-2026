name: storage-infra

on:
  push:
    branches: [main]
    paths:
      - "storage-infra/**"
      - ".github/workflows/storage-infra.yml"
      - ".github/workflows/_terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: apply

permissions:
  contents: read

jobs:
  storage-infra:
    uses: ./.github/workflows/_terraform.yml
    with:
      module: storage-infra
      action: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}
    secrets: inherit
