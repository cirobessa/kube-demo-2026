name: eks

on:
  push:
    branches: [main]
    paths:
      - "eks/**"
      - ".github/workflows/eks.yml"
      - ".github/workflows/_terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: apply

permissions:
  contents: read

jobs:
  eks:
    uses: ./.github/workflows/_terraform.yml
    with:
      module: eks
      action: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}
    secrets: inherit
