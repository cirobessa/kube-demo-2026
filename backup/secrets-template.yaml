stringData:
  POSTGRES_DB: postgres
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_PORT: '5432'
  POSTGRES_USER: backstage
