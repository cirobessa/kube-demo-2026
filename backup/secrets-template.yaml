# ==============================================================================
# Backstage Secrets Declarative Template
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backstage-basic-auth
  namespace: backstage
type: Opaque
stringData:
  username: "admin"
  password: "Backstage@2026"
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-credentials
  namespace: backstage
type: Opaque
stringData:
  POSTGRES_HOST: "${POSTGRES_HOST}"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "backstage"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-github-credentials
  namespace: backstage
type: Opaque
stringData:
  token: "${GITHUB_TOKEN}"
  # Optional OAuth / GitHub App keys:
  # client_id: "${GITHUB_APP_CLIENT_ID}"
  # client_secret: "${GITHUB_APP_CLIENT_SECRET}"
  # app_id: "${GITHUB_APP_ID}"
  # private_key: "${GITHUB_APP_PRIVATE_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-k8s-config
  namespace: backstage
type: Opaque
stringData:
  K8S_CLUSTER_NAME: "kube-demo-eks"
  K8S_API_URL: "https://kubernetes.default.svc"
