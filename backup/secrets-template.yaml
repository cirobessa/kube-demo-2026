---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-github-credentials
  namespace: backstage
stringData:
  token: ${GITHUB_TOKEN}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-k8s-config
  namespace: backstage
stringData:
  K8S_API_URL: https://kubernetes.default.svc
  K8S_CLUSTER_NAME: kube-demo-eks
type: Opaque
