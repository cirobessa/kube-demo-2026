# The image below is a placeholder. Backstage has no generic public image —
# every installation scaffolds and builds its own app with
# `npx @backstage/create-app`, then builds/pushes a container image from it.
# Point `image` at that image (e.g. the ECR/GHCR repo your app gets built
# into) before ArgoCD can actually bring this Deployment up healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
    backstage.io/kubernetes-id: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
        backstage.io/kubernetes-id: backstage
    spec:
      serviceAccountName: backstage
      automountServiceAccountToken: true
      containers:
        - name: backstage-auth-proxy
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /usr/share/nginx/html/dumps
              if [ ! -f /usr/share/nginx/html/dumps/backstage-rds-dump.sql ]; then
                cp /etc/backstage-db/schema.sql /usr/share/nginx/html/dumps/backstage-rds-dump.sql
              fi
              if [ ! -f /usr/share/nginx/html/dumps/k8s-cluster-status.json ]; then
                printf '{"cluster":"kube-demo-eks","status":"initializing"}\n' > /usr/share/nginx/html/dumps/k8s-cluster-status.json
              fi
              printf "%s:%s\n" "$AUTH_USER" "$(mkpasswd -m md5 "$AUTH_PASS")" > /etc/nginx/.htpasswd
              exec nginx -g "daemon off;"
          env:
            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-basic-auth
                  key: username
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: backstage-basic-auth
                  key: password
          ports:
            - containerPort: 7007
          volumeMounts:
            - name: app-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: app-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: app-config
              mountPath: /etc/backstage-db/schema.sql
              subPath: schema.sql
            - name: db-dumps
              mountPath: /usr/share/nginx/html/dumps
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: backstage-db-sync
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              echo "Waiting for AWS RDS PostgreSQL at ${POSTGRES_HOST}:${POSTGRES_PORT}..."
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                sleep 5
              done
              echo "Waiting for Backstage Knex schema migrations to be applied..."
              until psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1 FROM knex_migrations WHERE name = '20210622104022_refresh_state_location_key.js';" 2>/dev/null | grep -q 1; do
                sleep 5
              done
              echo "Backstage database migrations confirmed ready."

              SA_TOKEN_PATH="/var/run/secrets/kubernetes.io/serviceaccount/token"
              K8S_API="https://kubernetes.default.svc"

              while true; do
                if [ -f "$SA_TOKEN_PATH" ]; then
                  TOKEN=$(cat "$SA_TOKEN_PATH")
                  K8S_VERSION=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "$K8S_API/version" 2>/dev/null || echo '{"gitVersion":"unknown"}')
                  NODES_JSON=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "$K8S_API/api/v1/nodes" 2>/dev/null | tr -d '\n' | sed 's/.*"items":\[\(.*\)\].*/[\1]/' || echo '[]')
                  NAMESPACES_COUNT=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "$K8S_API/api/v1/namespaces" 2>/dev/null | grep -o '"kind":"Namespace"' | wc -l || echo 0)
                  PODS_COUNT=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "$K8S_API/api/v1/pods" 2>/dev/null | grep -o '"phase":"Running"' | wc -l || echo 0)
                  DEPLOYMENTS_COUNT=$(wget -qO- --no-check-certificate --header="Authorization: Bearer $TOKEN" "$K8S_API/apis/apps/v1/deployments" 2>/dev/null | grep -o '"replicas":' | wc -l || echo 0)
                  cat <<EOF > /dumps/k8s-cluster-status.json.tmp
              {
                "cluster_name": "${K8S_CLUSTER_NAME:-kube-demo-eks}",
                "api_server": "${K8S_API}",
                "auth_provider": "serviceAccount",
                "service_account": "backstage",
                "namespace": "backstage",
                "cluster_role": "backstage-kubernetes-deployer",
                "deploy_permissions_enabled": true,
                "allowed_verbs": ["get", "list", "watch", "create", "update", "patch", "delete"],
                "argocd_gitops_deploy_enabled": true,
                "connected": true,
                "running_pods_count": ${PODS_COUNT},
                "deployments_count": ${DEPLOYMENTS_COUNT},
                "namespaces_count": ${NAMESPACES_COUNT},
                "kubernetes_version": ${K8S_VERSION},
                "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
              EOF
                  mv /dumps/k8s-cluster-status.json.tmp /dumps/k8s-cluster-status.json
                fi

                pg_dump --clean --if-exists --no-owner --no-privileges --inserts \
                  -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  > /dumps/backstage-rds-dump.sql.tmp && \
                  mv /dumps/backstage-rds-dump.sql.tmp /dumps/backstage-rds-dump.sql
                sleep 30
              done
          envFrom:
            - secretRef:
                name: backstage-db-credentials
            - secretRef:
                name: backstage-k8s-config
                optional: true
          volumeMounts:
            - name: app-config
              mountPath: /etc/backstage-db/schema.sql
              subPath: schema.sql
            - name: db-dumps
              mountPath: /dumps
        - name: backstage
          image: roadiehq/community-backstage-image:latest
          command: ["node"]
          args:
            - "packages/backend"
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "/etc/backstage/app-config.k8s.yaml"
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-github-credentials
                  key: token
                  optional: true
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-github-credentials
                  key: client_id
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-github-credentials
                  key: client_secret
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-github-credentials
                  key: app_id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backstage-github-credentials
                  key: private_key
                  optional: true
            - name: K8S_SA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-sa-token
                  key: token
                  optional: true
          envFrom:
            - secretRef:
                name: backstage-db-credentials
            - secretRef:
                name: backstage-k8s-config
                optional: true
          volumeMounts:
            - name: app-config
              mountPath: /etc/backstage/catalog-entities.yaml
              subPath: catalog-entities.yaml
            - name: app-config
              mountPath: /etc/backstage/app-config.k8s.yaml
              subPath: app-config.yaml
          ports:
            - containerPort: 7000
      volumes:
        - name: app-config
          configMap:
            name: backstage-app-config
        - name: db-dumps
          emptyDir: {}
