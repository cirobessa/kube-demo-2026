apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf:
  - platform-team
  profile:
    displayName: Guest User
    email: guest@empresa.local
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  description: Platform Engineering & DevEx Team
  name: platform-team
spec:
  children: []
  members:
  - guest
  type: team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  description: AWS EKS 1.35 Platform, GitOps, Observability & Developer Portal
  name: kube-demo-2026
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  annotations:
    backstage.io/kubernetes-id: kube-demo-eks
    backstage.io/kubernetes-namespace: kube-system
  description: AWS EKS 1.35 Kubernetes Cluster connected via In-Cluster ServiceAccount
    RBAC
  name: kube-demo-eks
spec:
  owner: platform-team
  system: kube-demo-2026
  type: kubernetes-cluster
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  annotations:
    backstage.io/kubernetes-id: backstage
    backstage.io/kubernetes-label-selector: app=backstage
    backstage.io/kubernetes-namespace: backstage
  description: Backstage Internal Developer Portal backed by AWS RDS PostgreSQL and
    linked to EKS
  name: backstage-portal
spec:
  dependsOn:
  - resource:default/kube-demo-eks
  lifecycle: production
  owner: platform-team
  system: kube-demo-2026
  type: website
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  annotations:
    backstage.io/kubernetes-id: argocd
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=argocd
    backstage.io/kubernetes-namespace: argocd
  description: ArgoCD GitOps Continuous Delivery Controller on EKS
  name: argocd
spec:
  dependsOn:
  - resource:default/kube-demo-eks
  lifecycle: production
  owner: platform-team
  system: kube-demo-2026
  type: service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  annotations:
    backstage.io/kubernetes-id: grafana
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=grafana
    backstage.io/kubernetes-namespace: grafana
  description: Grafana Observability Dashboards connected to Prometheus
  name: grafana
spec:
  dependsOn:
  - resource:default/kube-demo-eks
  lifecycle: production
  owner: platform-team
  system: kube-demo-2026
  type: website
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  annotations:
    backstage.io/kubernetes-id: prometheus
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=prometheus
    backstage.io/kubernetes-namespace: monitoring
  description: Prometheus Metrics Server & Node Exporter on EKS
  name: prometheus
spec:
  dependsOn:
  - resource:default/kube-demo-eks
  lifecycle: production
  owner: platform-team
  system: kube-demo-2026
  type: service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  annotations:
    backstage.io/kubernetes-id: sonarqube
    backstage.io/kubernetes-namespace: sonarqube
  description: SonarQube QA & Security Scanner on EKS (OWASP Dependency-Check, FindSecBugs
    & YAML/K8s Security plugins)
  name: sonarqube
spec:
  dependsOn:
  - resource:default/kube-demo-eks
  lifecycle: production
  owner: platform-team
  system: kube-demo-2026
  type: service
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  annotations:
    backstage.io/kubernetes-id: grafana
    backstage.io/kubernetes-namespace: grafana
  description: Grafana Observability UI receiving metrics from Prometheus on EKS
  name: grafana
spec:
  dependsOn:
  - component:default/prometheus-monitoring
  - resource:default/kube-demo-eks
  lifecycle: production
  owner: platform-team
  system: kube-demo-2026
  type: service
