apps-demo\",\"prometheus.io/scrape\":\"true\",\"prometheus.io/path\":\"/metrics\",\"fluentd.io/destination\":\"loki\",\"grafana/overview-dashboard\":\"d/apps-prometheus-loki/8c87aef\"}},\"spec\":{\"type\":\"service\",\"lifecycle\":\"production\",\"owner\":\"platform-team\",\"dependsOn\":[\"resource:default/kube-demo-eks\"]}}',\n        '{\"apiVersion\":\"backstage.io/v1alpha1\",\"kind\":\"Component\",\"metadata\":{\"name\":\"dotnet-csharp-demo-app\",\"namespace\":\"default\",\"description\":\"C# .NET 8 Minimal API Demo App on EKS\",\"annotations\":{\"github.com/project-slug\":\"cirodasilvaj/apps-demo-2026\",\"sonarqube.org/project-key\":\"apps-demo-2026\",\"backstage.io/kubernetes-id\":\"dotnet-csharp-app\",\"backstage.io/kubernetes-namespace\":\"apps-demo\",\"prometheus.io/scrape\":\"true\",\"prometheus.io/path\":\"/metrics\",\"fluentd.io/destination\":\"loki\",\"grafana/overview-dashboard\":\"d/apps-prometheus-loki/8c87aef\"}},\"spec\":{\"type\":\"service\",\"lifecycle\":\"production\",\"owner\":\"platform-team\",\"dependsOn\":[\"resource:default/kube-demo-eks\"]}}',\n        'hash-dotnet-csharp-demo-app-v2',\n        'hash-dotnet-csharp-demo-app-v2'\n    )\nON CONFLICT (entity_id) DO UPDATE SET\n    unprocessed_entity = EXCLUDED.unprocessed_entity,\n    processed_entity = EXCLUDED.processed_entity,\n    result_hash = EXCLUDED.result_hash,\n    unprocessed_hash = EXCLUDED.unprocessed_hash,\n    last_discovery_at = NOW();\n\nINSERT INTO public.final_entities (entity_id, hash, stitch_ticket, final_entity, entity_ref)\nVALUES\n    (\n        'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',\n        'hash-kube-demo-eks-v2',\n        'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa',\n        '{\"apiVersion\":\"backstage.io/v1alpha1\",\"kind\":\"Resource\",\"metadata\":{\"name\":\"kube-demo-eks\",\"namespace\":\"default\",\"description\":\"AWS EKS 1.35 Kubernetes Cluster connected via In-Cluster ServiceAccount RBAC\",\"annotations\":{\"backstage.io/kubernetes-id\":\"kube-demo-eks\",\"back