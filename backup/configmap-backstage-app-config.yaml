# Minimal app-config for a demo instance: in-memory SQLite catalog, no
# external database. Replace with a Postgres-backed app-config.production.yaml
# before using this for anything beyond a demo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-app-config
  namespace: backstage
data:
  app-config.yaml: |
    app:
      title: Backstage Demo — kube-demo-2026
      baseUrl: http://localhost:7007
    organization:
      name: kube-demo-2026
    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7000
      cors:
        origin: http://localhost:7007
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          ssl:
            rejectUnauthorized: false
    auth:
      environment: development
      providers:
        guest: {}
        github:
          development:
            clientId: ${GITHUB_APP_CLIENT_ID:-${GITHUB_CLIENT_ID:-dummy-client-id}}
            clientSecret: ${GITHUB_APP_CLIENT_SECRET:-${GITHUB_CLIENT_SECRET:-dummy-client-secret}}
    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - url: https://kubernetes.default.svc
              name: kube-demo-eks
              authProvider: 'serviceAccount'
              skipTLSVerify: true
              skipMetricsLookup: false
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    scaffolder:
      defaultAuthor:
        name: Backstage Scaffolder
        email: platform-team@empresa.local
      defaultCommitMessage: "feat: initial service scaffold from Backstage template"
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User, Template]
      providers:
        github:
          cirodasilvaj:
            organization: 'cirodasilvaj'
            catalogPath: '/catalog-info.yaml'
            filters:
              branch: 'main'
              repository: '.*'
            schedule:
              frequency: { minutes: 15 }
              timeout: { minutes: 3 }
      locations:
        - type: file
          target: /etc/backstage/catalog-entities.yaml
        - type: github-discovery
          target: https://github.com/cirodasilvaj/*/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/cirodasilvaj/apps-demo-2026/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/cirodasilvaj/apps-demo-2026/blob/main/python-app/catalog-info.yaml
        - type: url
          target: https://github.com/cirodasilvaj/apps-demo-2026/blob/main/dotnet-csharp-app/catalog-info.yaml
        - type: url
          target: https://github.com/cirodasilvaj/samba-ad-keycloak/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/cirodasilvaj/backstage-infra/blob/main/templates/microservice-template/template.yaml
        - type: url
          target: https://github.com/cirodasilvaj/backstage-infra/blob/main/templates/python-sonarqube-cicd/template.yaml
        - type: url
          target: https://github.com/cirodasilvaj/backstage-infra/blob/main/templates/dotnet-sonarqube-cicd/template.yaml
        - type: url
          target: https://github.com/cirodasilvaj/backstage-infra/blob/main/templates/jvm-springboot-sonarqube-cicd/template.yaml
        - type: url
          target: https://github.com/cirodasilvaj/backstage-infra/blob/main/templates/nodejs-sonarqube-cicd/template.yaml
  catalog-entities.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: guest
    spec:
      profile:
        displayName: Guest User
        email: guest@empresa.local
      memberOf: [platform-team]
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: platform-team
      description: Platform Engineering & DevEx Team
    spec:
      type: team
      children: []
      members: [guest]
    ---
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: kube-demo-2026
      description: AWS EKS 1.35 Platform, GitOps, Observability & Developer Portal
    spec:
      owner: platform-team
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: kube-demo-eks
      description: AWS EKS 1.35 Kubernetes Cluster connected via In-Cluster ServiceAccount RBAC
      annotations:
        backstage.io/kubernetes-id: kube-demo-eks
        backstage.io/kubernetes-namespace: kube-system
    spec:
      type: kubernetes-cluster
      owner: platform-team
      system: kube-demo-2026
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: backstage-portal
      title: Backstage Developer Portal
      description: Backstage Internal Developer Portal backed by AWS RDS PostgreSQL and linked to EKS
      annotations:
        github.com/project-slug: cirodasilvaj/backstage-infra
        backstage.io/kubernetes-id: backstage
        backstage.io/kubernetes-namespace: backstage
        backstage.io/kubernetes-label-selector: app=backstage
      links:
        - url: http://backstage.799416476486.realhandsonlabs.net
          title: Backstage Portal UI
          icon: dashboard
        - url: https://github.com/cirodasilvaj/backstage-infra
          title: GitHub Infrastructure Repo
          icon: github
    spec:
      type: website
      lifecycle: production
      owner: platform-team
      system: kube-demo-2026
      dependsOn:
        - resource:default/kube-demo-eks
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: argocd
      title: ArgoCD GitOps
      description: ArgoCD GitOps Continuous Delivery Controller on EKS
      annotations:
        github.com/project-slug: cirobessa/kube-demo-2026
        backstage.io/kubernetes-id: argocd
        backstage.io/kubernetes-namespace: argocd
        backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=argocd
      links:
        - url: https://argocd.799416476486.realhandsonlabs.net
          title: ArgoCD Web Console (HTTPS ACM)
          icon: sync
        - url: https://github.com/cirobessa/kube-demo-2026
          title: GitOps Cluster Repository
          icon: github
    spec:
      type: service
      lifecycle: production
      owner: platform-team
      system: kube-demo-2026
      dependsOn:
        - resource:default/kube-demo-eks
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: grafana
      title: Grafana Observability
      description: Grafana Observability Dashboards connected to Prometheus and Loki
      annotations:
        github.com/project-slug: cirobessa/kube-demo-2026
        backstage.io/kubernetes-id: grafana
        backstage.io/kubernetes-namespace: grafana
        backstage.io/kubernetes-label-selector: app.kubernetes.io/name=grafana
      links:
        - url: http://grafana.799416476486.realhandsonlabs.net
          title: Grafana Dashboards UI
          icon: dashboard
        - url: https://github.com/cirobessa/kube-demo-2026
          title: Monitoring Config Repo
          icon: github
    spec:
      type: website
      lifecycle: production
      owner: platform-team
      system: kube-demo-2026
      dependsOn:
        - resource:default/kube-demo-eks
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: prometheus
      title: Prometheus Monitoring
      description: Prometheus Metrics Server & Node Exporter on EKS
      annotations:
        github.com/project-slug: cirobessa/kube-demo-2026
        backstage.io/kubernetes-id: prometheus
        backstage.io/kubernetes-namespace: monitoring
        backstage.io/kubernetes-label-selector: app.kubernetes.io/name=prometheus
      links:
        - url: http://prometheus.799416476486.realhandsonlabs.net
          title: Prometheus Web UI
          icon: gauge
        - url: https://github.com/cirobessa/kube-demo-2026
          title: Prometheus Manifests
          icon: github
    spec:
      type: service
      lifecycle: production
      owner: platform-team
      system: kube-demo-2026
      dependsOn:
        - resource:default/kube-demo-eks
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: sonarqube
      title: SonarQube Code Quality
      description: SonarQube QA & Security Scanner on EKS (OWASP Dependency-Check, FindSecBugs & YAML/K8s Security plugins)
      annotations:
        github.com/project-slug: cirobessa/kube-demo-2026
        backstage.io/kubernetes-id: sonarqube
        backstage.io/kubernetes-namespace: sonarqube
      links:
        - url: http://sonarqube.799416476486.realhandsonlabs.net
          title: SonarQube Dashboard UI
          icon: check
        - url: https://github.com/cirobessa/kube-demo-2026
          title: SonarQube QA Config
          icon: github
    spec:
      type: service
      lifecycle: production
      owner: platform-team
      system: kube-demo-2026
      dependsOn:
        - resource:default/kube-demo-eks
  schema.sql: |
    --
    -- Backstage Developer Portal - PostgreSQL Schema & Initial Seed Dump
    -- Database: backstage_plugin_catalog (AWS RDS PostgreSQL 16)
    -- Includes Kubernetes Cluster (kube-demo-eks) integration annotations
    --
    BEGIN;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS public.knex_migrations (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        batch INTEGER NOT NULL,
        migration_time TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS public.knex_migrations_lock (
        index SERIAL PRIMARY KEY,
        is_locked INTEGER DEFAULT 0
    );

    CREATE TABLE IF NOT EXISTS public.locations (
        id UUID PRIMARY KEY,
        type VARCHAR(255) NOT NULL,
        target TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS public.refresh_state (
        entity_id UUID PRIMARY KEY,
        entity_ref VARCHAR(255) NOT NULL UNIQUE,
        unprocessed_entity TEXT NOT NULL,
        processed_entity TEXT,
        cache TEXT,
        errors TEXT NOT NULL DEFAULT '[]',
        next_update_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        last_discovery_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        result_hash VARCHAR(255),
        unprocessed_hash VARCHAR(255)
    );

    CREATE INDEX IF NOT EXISTS refresh_state_entity_ref_idx ON public.refresh_state (entity_ref);
    CREATE INDEX IF NOT EXISTS refresh_state_next_update_at_idx ON public.refresh_state (next_update_at);

    CREATE TABLE IF NOT EXISTS public.final_entities (
        entity_id UUID PRIMARY KEY REFERENCES public.refresh_state(entity_id) ON DELETE CASCADE,
        hash VARCHAR(255) NOT NULL,
        stitch_ticket UUID NOT NULL,
        final_entity TEXT,
        entity_ref VARCHAR(255) NOT NULL UNIQUE,
        last_updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS final_entities_entity_ref_idx ON public.final_entities (entity_ref);

    CREATE TABLE IF NOT EXISTS public.relations (
        originating_entity_id UUID NOT NULL REFERENCES public.refresh_state(entity_id) ON DELETE CASCADE,
        source_entity_ref VARCHAR(255) NOT NULL,
        type VARCHAR(255) NOT NULL,
        target_entity_ref VARCHAR(255) NOT NULL
    );

    CREATE INDEX IF NOT EXISTS relations_source_entity_ref_idx ON public.relations (source_entity_ref);
    CREATE INDEX IF NOT EXISTS relations_target_entity_ref_idx ON public.relations (target_entity_ref);

    CREATE TABLE IF NOT EXISTS public.search (
        original_entity_id UUID NOT NULL REFERENCES public.refresh_state(entity_id) ON DELETE CASCADE,
        key VARCHAR(255) NOT NULL,
        value VARCHAR(255),
        original_value VARCHAR(255)
    );

    CREATE INDEX IF NOT EXISTS search_key_value_idx ON public.search (key, value);

    CREATE TABLE IF NOT EXISTS public.signing_keys (
        id VARCHAR(255) PRIMARY KEY,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        key TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS public.kubernetes_clusters (
        cluster_name VARCHAR(255) PRIMARY KEY,
        api_server_url TEXT NOT NULL,
        auth_provider VARCHAR(100) NOT NULL DEFAULT 'serviceAccount',
        service_account_name VARCHAR(255) NOT NULL DEFAULT 'backstage',
        service_account_namespace VARCHAR(255) NOT NULL DEFAULT 'backstage',
        skip_tls_verify BOOLEAN NOT NULL DEFAULT TRUE,
        skip_metrics_lookup BOOLEAN NOT NULL DEFAULT FALSE,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    INSERT INTO public.kubernetes_clusters (
        cluster_name, api_server_url, auth_provider, service_account_name, service_account_namespace, skip_tls_verify, skip_metrics_lookup
    ) VALUES (
        'kube-demo-eks', 'https://kubernetes.default.svc', 'serviceAccount', 'backstage', 'backstage', TRUE, FALSE
    ) ON CONFLICT (cluster_name) DO UPDATE SET
        api_server_url = EXCLUDED.api_server_url,
        auth_provider = EXCLUDED.auth_provider,
        service_account_name = EXCLUDED.service_account_name,
        service_account_namespace = EXCLUDED.service_account_namespace,
        updated_at = NOW();

    INSERT INTO public.locations (id, type, target)
    VALUES
        ('11111111-1111-1111-1111-111111111111', 'file', '/etc/backstage/catalog-entities.yaml'),
        ('22222222-2222-2222-2222-222222222222', 'url', 'https://github.com/cirodasilvaj/apps-demo-2026/blob/main/catalog-info.yaml')
    ON CONFLICT (id) DO NOTHING;

    INSERT INTO public.refresh_state (entity_id, entity_ref, unprocessed_entity, processed_entity, result_hash, unprocessed_hash)
    VALUES
        (
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
